fragment UserAdminListFields on User {
  id
  displayName
  email
  role
  status
  reputationScore
  isFoodSaver
  isVerified
  avatar {
    createdAt
    fileName
    fileSize
    fileType
    id
    jobId
    uploadStatus
    uploadedById
    url
  }
  createdAt
  updatedAt
  location {
    id
    city
    country
    neighborhood
  }
}

query AdminGetUserStats {
  adminGetUserStats {
    activeAccounts
    activeAccountsIncrease
    reportedIssues
    reportedIssuesIncrease
    totalUsers
    totalUsersIncrease
  }
}

query AdminGetUsers($page: Int = 1, $limit: Int = 10, $search: String, $role: UserRole, $status: String) {
  adminGetUsers(page: $page, limit: $limit, search: $search, role: $role, status: $status) {
    hasNextPage
    hasPreviousPage
    items {
      ...UserAdminListFields
    }
    limit
    page
    totalCount
  }
}

mutation SuspendUser($userId: String!) {
  suspendUser(userId: $userId) {
    id
    status
    displayName
    email
  }
}

mutation ActivateUser($userId: String!) {
  activateUser(userId: $userId) {
    id
    status
    displayName
    email
  }
}

mutation SendFcmNotification($input: SendNotificationInput!) {
  sendFcmNotification(input: $input) {
    message
    success
  }
}

mutation AdminCreateAccount($input: AdminCreateAccountInput!) {
  adminCreateAccount(input: $input) {
    id
    displayName
    email
    role
    status
    createdAt
  }
}

mutation AdminUpdateUserFoodSaverStatus($isFoodSaver: Boolean!, $userId: String!) {
  adminUpdateUserFoodSaverStatus(isFoodSaver: $isFoodSaver, userId: $userId) {
    ...UserAdminListFields
  }
}

mutation AdminUpdateUserVerificationStatus($isVerified: Boolean!, $userId: String!) {
  adminUpdateUserVerificationStatus(isVerified: $isVerified, userId: $userId) {
    ...UserAdminListFields
  }
}
